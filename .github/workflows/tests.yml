name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run isolated Ruby tests
        run: ruby test/test_upm.rb
      - name: Verify Homebrew command integration
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          tap_dir="$(brew --repository)/Library/Taps/azizoid/homebrew-upm"
          mkdir -p "$(dirname "$tap_dir")"
          ln -s "$GITHUB_WORKSPACE" "$tap_dir"
          brew trust --command azizoid/upm/upm
          brew upm --help
          brew upm --dry-run
